name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_VERSION: 1.95.0

jobs:
  build:
    name: Smoke build (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android app
        uses: actions/checkout@v5
        with:
          path: mediaflow-android

      - name: Checkout mediaflow-proxy-light
        uses: actions/checkout@v5
        with:
          repository: mhdzumair/mediaflow-proxy-light
          ref: main
          path: mediaflow-proxy-light

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install Rust + arm64 Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mediaflow-proxy-light/target
          key: android-smoke-rust-${{ hashFiles('mediaflow-proxy-light/Cargo.lock') }}

      - name: Build proxy binary (arm64 only)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_APP_DIR: ${{ github.workspace }}/mediaflow-android
          ABIS: arm64-v8a
        run: |
          cd mediaflow-proxy-light
          chmod +x tools/build-android.sh
          ./tools/build-android.sh

      - name: Stub other ABIs (smoke build only)
        # The APK won't install without all declared ABIs if ndk.abiFilters
        # is used.  For a smoke build, copy the arm64 binary to the other
        # slots — the APK just needs to package without error.
        run: |
          for abi in armeabi-v7a x86_64 x86; do
            mkdir -p mediaflow-android/app/src/main/jniLibs/$abi
            cp mediaflow-android/app/src/main/jniLibs/arm64-v8a/libmediaflow-proxy.so \
               mediaflow-android/app/src/main/jniLibs/$abi/libmediaflow-proxy.so
          done

      - name: Assemble debug APKs (mobile + tv)
        run: |
          cd mediaflow-android
          chmod +x gradlew
          ./gradlew :app:assembleMobileDebug :app:assembleTvDebug --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-arm64-smoke
          path: |
            mediaflow-android/app/build/outputs/apk/mobile/debug/*.apk
            mediaflow-android/app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: error
